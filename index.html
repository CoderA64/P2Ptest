<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walkie / AirDrop P2P Privado</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: #333; }
        .card { background: #f4f4f9; border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        #chat { border: 1px solid #ccc; height: 200px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fff; border-radius: 4px; }
        input, button { padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        input { width: 65%; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        button:disabled, input:disabled { background: #e0e0e0; cursor: not-allowed; }
        .code-box { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #007bff; margin: 10px 0; }
        .status-disconnected { color: #d9534f; font-weight: bold; }
        .status-connected { color: #5cb85c; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Conexión P2P Segura (WebRTC + Trystero)</h2>
    
    <div class="card">
        <h3>Tu código de sala privado:</h3>
        <div class="code-box" id="displaySala">Generando...</div>
        <p>Pásale este enlace o código a la otra persona para que se conecte contigo.</p>
    </div>

    <div class="card">
        <p>Estado de la red: <span id="status" class="status-disconnected">Esperando conexión...</span></p>
        
        <div id="chat"></div>
        
        <div style="display: flex; gap: 10px;">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." disabled>
            <button id="sendBtn" onclick="sendMessage()" disabled>Enviar</button>
        </div>
    </div>

    <!-- Importación limpia y directa mediante ESM CDN -->
    <script type="module">
        import { joinRoom } from 'https://esm.run/trystero';

        // 1. Generador de código: Letra-Número-Número-Número-Letra (ej: A-365-Y)
        function generarCodigoSala() {
            const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            const numeros = '0123456789';
            const rChar = (str) => str[Math.floor(Math.random() * str.length)];
            const rNum = (str) => str[Math.floor(Math.random() * str.length)];
            
            return `${rChar(letras)}-${rNum(numeros)}${rNum(numeros)}${rNum(numeros)}-${rChar(letras)}`;
        }

        // 2. Gestionar código de sala por URL
        const urlParams = new URLSearchParams(window.location.search);
        let codigoSala = urlParams.get('sala');

        if (!codigoSala) {
            codigoSala = generarCodigoSala();
            window.history.replaceState({}, '', `?sala=${codigoSala}`);
        }

        document.getElementById('displaySala').innerText = codigoSala;

        // 3. Conexión P2P con Trystero
        const config = { appId: 'mi-app-p2p-privada-2026' };
        const room = joinRoom(config, `sala-${codigoSala}`);

        const statusEl = document.getElementById('status');
        const chatEl = document.getElementById('chat');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        const [sendData, getData] = room.makeDataChannel('chat');

        room.onPeerJoin(peerId => {
            statusEl.innerText = `¡Conectado directamente (P2P)!`;
            statusEl.className = 'status-connected';
            inputEl.disabled = false;
            sendBtn.disabled = false;
            appendLog('Sistema', '¡La otra persona se ha unido a la sala!');
        });

        room.onPeerLeave(peerId => {
            statusEl.innerText = 'La otra persona se desconectó.';
            statusEl.className = 'status-disconnected';
            inputEl.disabled = true;
            sendBtn.disabled = true;
            appendLog('Sistema', 'El usuario ha abandonado la sesión.');
        });

        getData((data, peerId) => {
            appendLog('Compañero', data);
        });

        window.sendMessage = () => {
            const text = inputEl.value;
            if (!text) return;

            sendData(text);
            appendLog('Tú', text);
            inputEl.value = '';
        };

        function appendLog(sender, text) {
            chatEl.innerHTML += `<div><strong>${sender}:</strong> ${text}</div>`;
            chatEl.scrollTop = chatEl.scrollHeight;
        }
    </script>
</body>
</html>
